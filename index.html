<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>🏬 다층 백화점 길안내 (수정본) — 상대좌표 지원</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin:0; overflow:hidden; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
  canvas { border:1px solid #ccc; display:block; cursor:crosshair; }
  /* Controls */
  #controls {
    position: fixed;
    top: 10px;
    left: 50%;
    transform: translateX(-50%); /* 중앙 정렬 */
    background: rgba(255,255,255,0.95);
    padding: 10px;
    border-radius: 10px;
    z-index: 10;
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    backdrop-filter: saturate(1.2) blur(4px);
    max-width: calc(100vw - 20px);
    transition: width 220ms ease, height 220ms ease, padding 220ms ease;
}

  #controls .row { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; align-items:center; }
  select, button, input { margin:0; padding:8px 10px; border-radius:8px; border:1px solid #ddd; font-size:14px; }
  button { background:#0ea5e9; color:white; border:none; cursor:pointer; }
  button.secondary { background:#64748b; }
  button.warn { background:#ef4444; }
  button:active { transform: translateY(1px); }
  #infoBox {
    position: absolute;
    background: rgba(0,0,0,0.7); color:#fff; padding:6px 10px; border-radius:8px; font-weight:600;
    display:none; pointer-events:none; white-space: nowrap; z-index: 9;
  }
  #nodeDialog {
    display:none; position:fixed; top:50%; left:50%;
    transform:translate(-50%,-50%);
    background:#fff; border:1px solid #e5e7eb; padding:16px;
    border-radius:12px; z-index:1000; box-shadow:0 12px 30px rgba(0,0,0,0.25); width:min(92vw,420px);
  }
  #nodeDialog h3 { margin:0 0 10px 0; font-size:18px; }
  /* 🔽 노드 타입 버튼 컬러 & 스타일 (추가) */
  #nodeDialog .typeBtn {
    margin:4px;
    padding:6px 12px;
    cursor:pointer;
    border-radius:999px;
    font-weight:600;
    border:1px solid transparent;
    transition: transform 0.1s ease, box-shadow 0.1s ease, opacity 0.1s ease;
  }

  #nodeDialog .typeBtn[data-type="normal"] {
    background:#2563eb;
    color:#fff;
  }

  #nodeDialog .typeBtn[data-type="elevator"] {
    background:#16a34a;
    color:#fff;
  }

  #nodeDialog .typeBtn[data-type="stairs"] {
    background:#f59e0b;
    color:#fff;
  }

  #nodeDialog .typeBtn[data-type="escalator"] {
    background:#9333ea;
    color:#fff;
  }

  #nodeDialog .typeBtn.active {
    box-shadow: 0 0 0 3px rgba(0,0,0,0.25);
  }

  #nodeDialog .typeBtn:active {
    transform: translateY(1px);
    opacity: 0.9;
  }

  #nodeDialog label { display:block; margin-top:8px; }
  #searchResults {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    width: 100%;
    min-width: 0;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    display: none;
    z-index: 20;
    max-height: 220px;
    overflow-y: auto;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
  }

  #searchResults div { padding:6px 8px; cursor:pointer; }
  #searchResults div:hover { background:#eef; }

  /* Toggle (small hamburger) button inside controls */
  #toggleControlsBtn { display:inline-flex; align-items:center; justify-content:center; width:40px; height:40px; padding:0; font-size:18px; background:transparent; color:#0f172a; border-radius:8px; border:1px solid transparent; cursor:pointer; }
  #toggleControlsBtn:focus { outline:2px solid #cbd5e1; }

  /* Collapsed style: hide most rows visually but keep DOM intact (functionality preserved) */
  #controls.collapsed { width:56px; height:56px; padding:6px; overflow:visible; }
  #controls.collapsed strong { display:none; }
  #controls.collapsed .row { margin-top:4px; }
  /* hide all */
  #controls.collapsed .row:not(.toggleRow) {
   display: none;
  }
  
  /* 출발지/목적지 커스텀 피커 */
  .picker { position: relative; display: inline-flex; align-items: center; gap: 4px; }
  .pickerLabel { font-size: 14px; color: #0f172a; }
  .pickerField {
    background: #fff; color: #0f172a; border: 1px solid #cbd5e1;
    text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    min-width: 110px; max-width: 150px;
  }
  .pickerField.has-value { border-color: #0ea5e9; font-weight: 600; }
  .pickerArrow {
    background: #64748b; color: #fff; border: none;
    padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 12px;
  }
  .pickerList {
    position: absolute; top: calc(100% + 4px); left: 0;
    min-width: 180px; max-width: 240px; max-height: 40vh; overflow-y: auto;
    background: #fff; border: 1px solid #e5e7eb; border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.18); display: none; z-index: 30;
  }
  .pickerList div { padding: 8px 10px; cursor: pointer; font-size: 14px; }
  .pickerList div:hover { background: #eef; }
  .pickerList .empty { color: #64748b; cursor: default; }

  @media (max-width: 640px) {
    #controls {
        left: 50%;
        transform: translateX(-50%);
    }
    select, input { min-width: 140px; }
}

</style>
</head>
<body>

<div id="controls" class="collapsed" role="region" aria-label="길안내 컨트롤">

  <!-- 1️⃣ ☰ 버튼 전용 row -->
  <div class="row toggleRow">
    <button id="toggleControlsBtn" aria-expanded="true" title="컨트롤 접기/펼치기">☰</button>
  </div>

  <!-- 2️⃣ 층간 길안내 + 다운로드/초기화 버튼 -->
  <div class="row">
    <strong>층간 길안내</strong>
    <button id="downloadBtn" class="secondary" title="현재 노드 데이터를 JSON으로 저장">JSON 다운로드</button>
    <button id="resetBtn" class="warn" title="경로 및 상태 초기화">초기화</button>
    <button id="stopBlinkBtn" class="secondary" title="강조 해제">깜빡임 해제</button>
  </div>

  <!-- 3️⃣ 출발지/목적지/길찾기 -->
  <div class="row">
    <select id="start" hidden></select>
    <select id="end" hidden></select>

    <span class="picker">
      <span class="pickerLabel">출발지</span>
      <button type="button" id="startBtn" class="pickerField" title="누르면 지도에서 직접 선택">지도에서 선택</button>
      <button type="button" id="startArrow" class="pickerArrow" aria-haspopup="listbox" aria-label="출발지 전체 목록">▼</button>
      <div id="startList" class="pickerList" role="listbox" aria-label="출발지 목록"></div>
    </span>

    <span class="picker">
      <span class="pickerLabel">목적지</span>
      <button type="button" id="endBtn" class="pickerField" title="누르면 지도에서 직접 선택">지도에서 선택</button>
      <button type="button" id="endArrow" class="pickerArrow" aria-haspopup="listbox" aria-label="목적지 전체 목록">▼</button>
      <div id="endList" class="pickerList" role="listbox" aria-label="목적지 목록"></div>
    </span>

    <button id="routeBtn" title="최단 경로 찾기">길찾기</button>
  </div>

  <!-- 4️⃣ 위치 검색 / 노드추가 -->
  <div class="row" style="position:relative;">
    위치 검색: <input type="text" id="searchInput" autocomplete="off" placeholder="예: 1번 계단 / 푸드코트">
    <button id="searchBtn">검색</button>
    <button id="addNodeBtn">노드추가</button>
    <div id="searchResults" role="listbox" aria-label="검색 결과"></div>
  </div>

</div>

<div id="infoBox"></div>
<canvas id="map" aria-label="층간 지도 캔버스"></canvas>

<!-- 노드 입력 다이얼로그 -->
<div id="nodeDialog" role="dialog" aria-modal="true" aria-labelledby="nodeDialogTitle">
  <h3 id="nodeDialogTitle">새 노드 추가</h3>
  <div>
    <label>
      <input type="radio" name="floorType" value="지상" checked> 지상
    </label>
    <label>
      <input type="radio" name="floorType" value="지하"> 지하
    </label>
    <label>
      층/구역:
      <select id="floorNumber">
        <option>1층 1구역</option>
        <option>1층 2구역</option>
        <option>1층 3구역</option>
        <option>2층 1구역</option>
        <option>2층 2구역</option>
        <option>2층 3구역</option>
        <option>3층 1구역</option>
        <option>3층 2구역</option>
        <option>3층 3구역</option>
        <!-- 필요에 따라 확장 -->
      </select>
    </label>
  </div>
  <label>노드 이름:
    <input type="text" id="nodeName" placeholder="예: 1번 계단 / 에스1 / 엘리1">
  </label>
  <div style="margin-top:8px;">
    <span>노드 타입:</span><br>
    <button type="button" class="typeBtn" data-type="normal">normal</button>
    <button type="button" class="typeBtn" data-type="elevator">elevator</button>
    <button type="button" class="typeBtn" data-type="stairs">stairs</button>
    <button type="button" class="typeBtn" data-type="escalator">escalator</button>
  </div>
  <label>참고사항:
    <input type="text" id="nodeNote" placeholder="예: 출입구/화장실 방향 등">
  </label>
  <div style="margin-top:12px; display:flex; gap:8px; justify-content:flex-end;">
    <button id="cancelNodeBtn" class="secondary">취소</button>
    <button id="saveNodeBtn">저장</button>
  </div>
</div>

<script>
/** ===== 전역 상태 ===== */
const canvas = document.getElementById('map');
const ctx = canvas.getContext('2d');

const searchInput = document.getElementById('searchInput');
const infoBox = document.getElementById('infoBox');
const startSel = document.getElementById('start');
const endSel = document.getElementById('end');
const startBtn = document.getElementById('startBtn');
const endBtn = document.getElementById('endBtn');
const startArrow = document.getElementById('startArrow');
const endArrow = document.getElementById('endArrow');
const startList = document.getElementById('startList');
const endList = document.getElementById('endList');
const addNodeBtn = document.getElementById('addNodeBtn');
const searchResults = document.getElementById('searchResults');
const routeBtn = document.getElementById('routeBtn');
const resetBtn = document.getElementById('resetBtn');
const downloadBtn = document.getElementById('downloadBtn');
const toggleBtn = document.getElementById('toggleControlsBtn');
const controls = document.getElementById('controls');

let floorImg = null;
let nodes = {};      // nodes should store normalized coords x,y in 0..1 if possible
let edges = {};      
let nodeNames = [];  
let blinkNode = null;
let blinkInterval = null;
let blinkPersistent = false;
let pathNodes = [];
let selectingMode = null; 
let selectPending = null;   // ← ✅ 바로 여기!
let addingNodeMode = false;
let tempX=0, tempY=0, selectedType='normal';
let password = 'knp123';
let isSelectOpen = false; // ← 🔑 추가 (select 깜빡임 방지용)

// helper: compatibility flags
let imageLoaded = false;

/** ===== 반응형 캔버스 ===== */
function resizeCanvas(){
  const vv = window.visualViewport;
  const vw = Math.round(vv ? vv.width  : (window.innerWidth  || document.documentElement.clientWidth  || 0));
  const vh = Math.round(vv ? vv.height : (window.innerHeight || document.documentElement.clientHeight || 0));
  if(vw <= 0 || vh <= 0) return;
  if(canvas.width !== vw)  canvas.width  = vw;
  if(canvas.height !== vh) canvas.height = vh;
  draw();
}
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 300));
window.addEventListener('load', () => { resizeCanvas(); setTimeout(resizeCanvas, 200); });
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', resizeCanvas);
}

/** ===== 이미지/JSON 자동 로드 ===== */
function loadFloorImage(){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => { floorImg = img; imageLoaded = true; resizeCanvas(); resolve(); };
    img.onerror = reject;
    img.src = 'floorplan.png'; // 같은 폴더에 배치
  });
}

function loadLocations(){
  return fetch('locations.json', { cache: 'no-store' })
    .then(res => {
      if(!res.ok) throw new Error('locations.json 로드 실패: ' + res.status);
      return res.json();
    })
    .then(data => {
      nodes = data.nodes || {};
      edges = data.edges || {};
      nodeNames = data.nodeNames || Object.keys(nodes);
      // ensure edges keys exist
      nodeNames.forEach(n => { edges[n] = edges[n] || []; });

      // --- IMPORTANT FIX: ensure every node has an explicit 'label' property (the user-provided name)
      // This makes type-based inter-floor linking reliable even when floor strings contain spaces.
      nodeNames.forEach(n => {
        if(!nodes[n].label){
          // if node object contains floor, we can strip that prefix to recover label
          if(nodes[n].floor){
            const prefix = nodes[n].floor + ' ';
            if(n.startsWith(prefix)) nodes[n].label = n.slice(prefix.length);
            else nodes[n].label = n; // fallback
          } else {
            // fallback: take the last token
            const parts = n.split(' ');
            nodes[n].label = parts.slice(-1)[0] || n;
          }
        }
      });

    })
    .catch(err => {
      console.warn(err);
      nodes = {};
      edges = {};
      nodeNames = [];
    });
}

/** ===== 초기화 시퀀스 ===== */
(async function init(){
  // ☰ 버튼만 보이도록 초기 상태에서 collapsed 적용 (로드 대기 전에 즉시)
  controls.classList.add('collapsed');
  await Promise.allSettled([loadFloorImage(), loadLocations()]);
  bindUI();
  resizeCanvas();
  draw();
  // 모바일 세로화면 최초 로딩 시 뷰포트 확정 후 재계산
  requestAnimationFrame(resizeCanvas);
  setTimeout(resizeCanvas, 150);
  setTimeout(resizeCanvas, 500);
})();

/** ===== 라벨 도우미 ===== */
function getLabel(fullName){
  // Prefer explicit stored label for robustness. If missing, fall back to original behaviour.
  if(nodes[fullName] && nodes[fullName].label) return nodes[fullName].label;
  const s = fullName.split(' ');
  return s.length > 1 ? s.slice(1).join(' ').trim() : fullName;
}

/** ===== UI 바인딩 ===== */
function bindUI(){
  // 출발지/목적지 칸 클릭 → 목록을 열지 않고, 지도에서 직접 클릭하도록 안내만
  startBtn.addEventListener('click',(e)=>{ e.stopPropagation(); closeLists(); enterSelectingMode('start'); });
  endBtn.addEventListener('click',(e)=>{ e.stopPropagation(); closeLists(); enterSelectingMode('end'); });
  // 화살표(▼) 클릭 → 등록된 전체 위치 목록을 드롭다운으로 표시
  startArrow.addEventListener('click',(e)=>{ e.stopPropagation(); toggleList('start'); });
  endArrow.addEventListener('click',(e)=>{ e.stopPropagation(); toggleList('end'); });

  routeBtn.addEventListener('click', findPath);
  resetBtn.addEventListener('click', ()=> resetAll(false));
  downloadBtn.addEventListener('click', downloadJSON);
  document.getElementById('searchBtn').addEventListener('click', manualSearch);

  canvas.addEventListener('touchstart', (e) => {
    const t = e.changedTouches[0];
    const rect = canvas.getBoundingClientRect();
    const x = t.clientX - rect.left;
    const y = t.clientY - rect.top;

    longPressTriggered = false;

    touchTimer = setTimeout(() => {
      longPressTriggered = true;
      handleLongPress(x, y); // 1초 이상 눌렀을 때
    }, 1000);

  }, {passive:true});

  canvas.addEventListener('touchend', (e) => {
    if (touchTimer) clearTimeout(touchTimer);

    if (!longPressTriggered) {
      const t = e.changedTouches[0];
      const rect = canvas.getBoundingClientRect();
      const x = t.clientX - rect.left;
      const y = t.clientY - rect.top;
      handleCanvasTap(x, y); // 짧게 터치 = PC 1클릭
    }
  }, {passive:true});

  canvas.addEventListener('click', (e) => {
    if (longPressTriggered || touchTimer) return; // ← 🔥 핵심
    const rect = canvas.getBoundingClientRect();
    handleCanvasTap(e.clientX - rect.left, e.clientY - rect.top);
  });

  addNodeBtn.addEventListener('click',()=>{
    const inputPwd = prompt("노드추가 비밀번호를 입력하세요:");
    if(inputPwd === password){
      showInfo('캔버스에서 노드를 추가할 위치를 탭/클릭하세요.', 2000);
      addingNodeMode = true;
    } else {
      alert("비밀번호 틀림. 노드추가 취소.");
    }
  });

  searchInput.addEventListener('input', ()=>{
    const query = searchInput.value;
    const results = searchNodes(query);
    searchResults.innerHTML='';

    if(results.length>0){
      searchResults.style.display='block';
      results.forEach(r=>{
        const div = document.createElement('div');
        div.textContent = r.display;
        div.addEventListener('click', ()=>{
          searchInput.value = getLabel(r.fullName);
          searchResults.style.display='none';
          highlightNode(r.fullName);
        });
        searchResults.appendChild(div);
      });
    } else {
      searchResults.style.display='none';
    }
  });



  document.querySelectorAll('#nodeDialog .typeBtn').forEach(btn =>
    btn.addEventListener('click',()=>{
      selectedType = btn.dataset.type;
      document.querySelectorAll('#nodeDialog .typeBtn')
        .forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    })
  );

  document.getElementById('cancelNodeBtn').addEventListener('click', closeNodeDialog);
  document.getElementById('saveNodeBtn').addEventListener('click', saveNode);

  // Toggle controls collapse/expand
  toggleBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    const isCollapsed = controls.classList.toggle('collapsed');
    toggleBtn.setAttribute('aria-expanded', String(!isCollapsed));
    // update tooltip/title
    toggleBtn.title = isCollapsed ? '컨트롤 펼치기' : '컨트롤 접기';
  });

  document.getElementById('stopBlinkBtn').addEventListener('click', stopBlink);

  // close search results when clicking elsewhere
  document.addEventListener('click', (e)=>{
    if(!controls.contains(e.target)) searchResults.style.display='none';
    if(!(e.target.closest && e.target.closest('.picker'))) closeLists();
  });
}

/** ===== 출발지/목적지 커스텀 피커 ===== */
function closeLists(){
  startList.style.display = 'none';
  endList.style.display = 'none';
}

function toggleList(mode){
  const list = (mode==='start') ? startList : endList;
  const willOpen = list.style.display !== 'block';
  closeLists();
  if(!willOpen) return;

  list.innerHTML = '';
  if(nodeNames.length === 0){
    const d = document.createElement('div');
    d.className = 'empty';
    d.textContent = '등록된 위치가 없습니다';
    list.appendChild(d);
  } else {
    nodeNames.forEach(n=>{
      const d = document.createElement('div');
      d.setAttribute('role','option');
      d.textContent = getLabel(n);
      d.title = n;
      d.addEventListener('click',(e)=>{
        e.stopPropagation();
        setEndpoint(mode, n);
        closeLists();
        showInfo((mode==='start'?'출발지':'목적지') + ' 선택: ' + getLabel(n), 1200);
        draw();
      });
      list.appendChild(d);
    });
  }
  list.style.display = 'block';
}

function setEndpoint(mode, fullName){
  const sel = (mode==='start') ? startSel : endSel;
  const btn = (mode==='start') ? startBtn : endBtn;
  sel.innerHTML = '';
  const opt = document.createElement('option');
  opt.value = fullName;
  opt.textContent = getLabel(fullName);
  sel.appendChild(opt);
  sel.value = fullName;
  btn.textContent = getLabel(fullName);
  btn.classList.add('has-value');
  selectingMode = null;
  selectPending = null;
}

/** ===== 정보 토스트 ===== */
let infoTimeout = null;
function showInfo(text, ms=2000, x=null, y=null){
  if(infoTimeout){ clearTimeout(infoTimeout); infoTimeout=null; }
  infoBox.style.display='block';
  infoBox.textContent = text;
  if(x!==null && y!==null){
    infoBox.style.left = (x+10) + 'px';
    infoBox.style.top = (y-30) + 'px';
  } else {
    infoBox.style.left = '10px';
    infoBox.style.top = (window.innerHeight-48)+'px';
  }
  if(ms>0){
    infoTimeout = setTimeout(()=>{ infoBox.style.display='none'; infoTimeout=null; }, ms);
  }
}

/** ===== 선택 모드 ===== */
function enterSelectingMode(mode){
  selectingMode = mode;
  closeLists();
  showInfo('지도에서 ' + (mode==='start'?'출발지':'목적지') + ' 위치를 직접 클릭하세요.', 2500);
}

/** ===== 좌표 변환 유틸 ===== */
function getNodeDisplayCoords(name){
  const n = nodes[name];
  if(!n) return null;
  const hasNorm = (typeof n.x === 'number' && typeof n.y === 'number' && n.x<=1 && n.y<=1);
  if(hasNorm){
    return {
            x: mapOffsetX + (n.x * floorImg.width * mapScale),
            y: mapOffsetY + (n.y * floorImg.height * mapScale)
           };
  }
  if(imageLoaded && floorImg && floorImg.width && floorImg.height){
    return { x: (n.x / floorImg.width) * canvas.width, y: (n.y / floorImg.height) * canvas.height };
  }
  return { x: n.x, y: n.y };
}

function getNodeNormalizedCoordsFromCanvas(px,py){
  return { x: px / canvas.width, y: py / canvas.height };

}

/** ===== 캔버스 탭/클릭 핸들러 ===== */
let lastClickTime = 0;
let touchTimer = null;
let longPressTriggered = false;

function handleCanvasTap(x,y){
  if(!floorImg) return;
  const clickedNode = findNodeAt(x,y);

  if(selectingMode){
    if(clickedNode){
      const mode = selectingMode;
      setEndpoint(mode, clickedNode);
      showInfo((mode==='start'?'출발지':'목적지') + ' 선택 완료: ' + getLabel(clickedNode), 1200);
      draw();
      return;
    } else {
      showInfo('위치 점을 정확히 클릭하세요.', 1200);
      return;
    }
  }

  if(addingNodeMode){
    tempX = x;
    tempY = y;
    openNodeDialog();
    addingNodeMode = false;
    return;
  }

  if(clickedNode){
    const now = Date.now();
    if(now - lastClickTime < 300){
      const inputPwd = prompt("노드 삭제 비밀번호를 입력하세요:");
      if(inputPwd === password){
        deleteNode(clickedNode);
        showInfo('노드 삭제 완료',1200,x,y);
        draw();
      } else {
        alert("비밀번호 틀림. 삭제 취소.");
      }
    } else {
      const n = nodes[clickedNode];
      showInfo(`${getLabel(clickedNode)} : ${n.note||'참고사항 없음'}`, 2000, x, y);
    }
    lastClickTime = now;
  }
}

function handleLongPress(x, y){
  const clickedNode = findNodeAt(x,y);
  if(!clickedNode) return;

  const inputPwd = prompt("노드 삭제 비밀번호를 입력하세요:");
  if(inputPwd === password){
    deleteNode(clickedNode);
    showInfo('노드 삭제 완료',1200,x,y);
    draw();
  } else {
    alert("비밀번호 틀림. 삭제 취소.");
  }
}


/** ===== 유틸 ===== */
function findNodeAt(x,y){
  for(let name of nodeNames){
    const d = getNodeDisplayCoords(name);
    if(!d) continue;
    if(Math.hypot(d.x-x,d.y-y)<=12) return name;
  }
  return null;
}

/** ===== 그래프 연산: Dijkstra (display coords used for distance calc) ===== */
function distanceByDisplay(aName,bName){
  const a = getNodeDisplayCoords(aName);
  const b = getNodeDisplayCoords(bName);
  if(!a || !b) return Infinity;
  return Math.hypot(a.x-b.x,a.y-b.y);
}

function dijkstra(start,end,allowedNodes=null){
  const visited=new Set(), distances={}, prev={};
  const targetNodes = allowedNodes || nodeNames.slice();
  targetNodes.forEach(n=>{ distances[n]=Infinity; });
  distances[start]=0;

  while(visited.size<targetNodes.length){
    let minNode=null;
    for(let n of targetNodes){
      if(!visited.has(n)&&(minNode===null||distances[n]<distances[minNode])) minNode=n;
    }
    if(minNode===null) break;
    if(minNode===end) break;
    visited.add(minNode);

    const adj = edges[minNode]||[];
    for(let nb of adj){
      if(!targetNodes.includes(nb)) continue;
      const alt = distances[minNode]+distanceByDisplay(minNode,nb);
      if(alt<distances[nb]) { distances[nb]=alt; prev[nb]=minNode; }
    }
  }

  const path=[]; let curr=end;
  while(curr){ path.unshift(curr); curr=prev[curr]; }
  if(path[0]!==start) return [];
  return path;
}

function multiFloorPath(startName,endName){
  return dijkstra(startName,endName);
}

function findPath(){
  const s = startSel.value; const e = endSel.value;
  if(!s || !e){ alert('출발지/목적지를 선택하세요.'); return; }
  pathNodes = multiFloorPath(s,e) || [];
  if(pathNodes.length===0) alert('경로를 찾을 수 없습니다.');
  draw();
}

/** ===== 검색 ===== */
function normalize(str){
  return String(str||'').replace(/\s+/g,'').replace(/[^\w가-힣]/g,'').toLowerCase();
}

function searchNodes(query){
  const q = normalize(query);
  if(q.length<2) return [];
  const results=[];
  for(let name of nodeNames){
    const node = nodes[name];
    const fields = [name, node.type, node.note||'', node.label||''];
    for(let f of fields){
      if(normalize(f).includes(q)){
        results.push({fullName:name, display:`${getLabel(name)} [${node.type}] ${node.note||''}`});
        break;
      }
    }
  }
  return results;
}

function manualSearch(){
  const val = searchInput.value.trim();
  if(!val){ alert('검색어를 입력하세요.'); return; }
  const results = searchNodes(val);
  if(results.length>0) highlightNode(results[0].fullName);
  else alert('노드를 찾을 수 없습니다.');
}

/** ===== 깜빡임 강조 ===== */
function highlightNode(name=null){
  const nodeToBlink = name || nodeNames.find(n=>getLabel(n)===searchInput.value);
  if(!nodeToBlink){ alert("노드 없음"); return; }

  if(blinkInterval) clearInterval(blinkInterval);
  blinkNode = nodeToBlink;
  blinkPersistent = true; // 이제 계속 깜빡임

  let opacity = 0.2;
  let growing = true;

  blinkInterval = setInterval(()=>{
    if(growing){ opacity += 0.1; if(opacity >= 0.85) growing = false; } 
    else { opacity -= 0.1; if(opacity <= 0.2) growing = true; }
    draw(opacity);
  }, 100);
}

function stopBlink(){
  if(blinkInterval){
    clearInterval(blinkInterval);
    blinkInterval = null;
  }
  blinkNode = null;
  blinkPersistent = false;
  draw();
}



/** ===== 초기화 ===== */
function resetAll(skipConfirm=false){
  if(!skipConfirm && !confirm("경로 및 강조를 초기화하시겠습니까?")) return;
  pathNodes=[];
  if(blinkInterval){ clearInterval(blinkInterval); blinkInterval=null; }
  blinkNode=null;
  selectingMode = null;
  addingNodeMode = false;
  if(infoTimeout){ clearTimeout(infoTimeout); infoTimeout=null; }
  infoBox.style.display='none';
  startSel.innerHTML=''; endSel.innerHTML='';
  startBtn.textContent = '지도에서 선택'; endBtn.textContent = '지도에서 선택';
  startBtn.classList.remove('has-value'); endBtn.classList.remove('has-value');
  closeLists();
  searchResults.style.display='none';
  draw();
}

/** ===== 노드 다이얼로그 ===== */
function openNodeDialog(){ document.getElementById('nodeDialog').style.display='block'; }
function closeNodeDialog(){ document.getElementById('nodeDialog').style.display='none'; }

function addEdge(a,b){
  edges[a]=edges[a]||[]; edges[b]=edges[b]||[];
  if(!edges[a].includes(b)) edges[a].push(b);
  if(!edges[b].includes(a)) edges[b].push(a);
}

function saveNode(){
  const name = document.getElementById('nodeName').value.trim();
  const floorType = document.querySelector('input[name="floorType"]:checked').value;
  const floor = floorType + ' ' + document.getElementById('floorNumber').value; // 선택된 구역 포함
  const note = document.getElementById('nodeNote').value;
  
  if(!name){ alert("노드 이름을 입력하세요."); return; }
  const fullName = `${floor} ${name}`;
  if(nodes[fullName]){ alert("이미 존재하는 노드입니다."); return; }

  // 캔버스 좌표를 정규화
  const norm = getNodeNormalizedCoordsFromCanvas(tempX, tempY);
  // store label (the pure node name) explicitly — this is the key fix for robust inter-floor matching
  nodes[fullName] = { x: Number(norm.x.toFixed(6)), y: Number(norm.y.toFixed(6)), floor, type:selectedType, note, label: name };
  nodeNames.push(fullName);

  // 같은 층(구역 단위) 자동 연결 (unchanged behaviour)
  nodeNames.forEach(n => {
    if(n!==fullName && nodes[n].floor===floor){
      addEdge(n, fullName);
    }
  });

  // 타입별 층간 연결 — now uses explicit 'label' property to compare node identity across floors
  if(selectedType==='escalator' || selectedType==='stairs' || selectedType==='elevator'){
    for(let n of nodeNames){
      if(n===fullName) continue;
      if(nodes[n].type===selectedType && (nodes[n].label||getLabel(n)) === name){
        addEdge(n, fullName);
      }
    }
  }

  closeNodeDialog(); draw();
  draw();
  document.getElementById('nodeName').value='';
  document.getElementById('nodeNote').value='';
  showNodeJson(fullName);  
}

function deleteNode(name){
  delete nodes[name];
  nodeNames = nodeNames.filter(nm=>nm!==name);
  delete edges[name];
  for(let key in edges){ edges[key]=edges[key].filter(nm=>nm!==name); }
  pathNodes=[];
}

/** ===== JSON 다운로드 ===== */
function downloadJSON(){
  const data = { nodes, edges, nodeNames };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);

  const a = document.createElement('a');
  a.href = url;
  a.download = 'locations.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showInfo('locations.json 다운로드 완료', 1400);
}

let mapScale = 1;
let mapOffsetX = 0;
let mapOffsetY = 0;

function drawFloorImage(){

  const imgRatio = floorImg.width / floorImg.height;
  const canvasRatio = canvas.width / canvas.height;

  let drawW, drawH;

  if(canvasRatio > imgRatio){
    drawH = canvas.height;
    drawW = drawH * imgRatio;
  }else{
    drawW = canvas.width;
    drawH = drawW / imgRatio;
  }

  mapOffsetX = (canvas.width - drawW) / 2;
  mapOffsetY = (canvas.height - drawH) / 2;

  mapScale = drawW / floorImg.width;

  ctx.drawImage(
    floorImg,
    mapOffsetX,
    mapOffsetY,
    drawW,
    drawH
  );
}

/** ===== 그리기 ===== */
function draw(opacity=1){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  if(floorImg){
    drawFloorImage();
  }

  // 경로
  if(pathNodes.length>1){
    ctx.strokeStyle='red'; ctx.lineWidth=4; ctx.lineJoin='round';
    ctx.beginPath();
    pathNodes.forEach((n,i)=>{
      const d = getNodeDisplayCoords(n);
      if(!d) return;
      if(i===0) ctx.moveTo(d.x,d.y);
      else ctx.lineTo(d.x,d.y);
    });
    ctx.stroke();
  }

  // 노드
  ctx.font = '12px system-ui';
  ctx.textBaseline = 'middle';
  nodeNames.forEach(n=>{
    const node=nodes[n]; if(!node) return;
    const d = getNodeDisplayCoords(n);
    if(!d) return;
    let radius = 9;
    if(n===blinkNode) radius = 9 * 2; // 18px
    ctx.beginPath();
    ctx.arc(d.x,d.y,radius,0,Math.PI*2);
    if(n===blinkNode){ ctx.fillStyle=`rgba(255,0,0,${opacity})`; }
    else if(pathNodes.includes(n)){ ctx.fillStyle='red'; }
    else {
      ctx.fillStyle = (node.type==='normal') ? '#2563eb'
                    : (node.type==='stairs') ? '#f59e0b'
                    : (node.type==='elevator') ? '#16a34a'
                    : '#9333ea';
    }
    ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.6)'; ctx.stroke();

    // 라벨
    ctx.fillStyle='black';
    ctx.fillText(getLabel(n), d.x + radius + 6, d.y);
  });
}

function showNodeJson(fullName){
  const obj = {};
  obj[fullName] = nodes[fullName];

  const text = JSON.stringify(obj, null, 2)
    .replace(/^{\n/, '')
    .replace(/\n}$/, '');

  const panel = document.getElementById('nodeJsonPanel');
  const ta = document.getElementById('nodeJsonOutput');
  ta.value = text;
  panel.style.display = 'block';
  ta.select();
}

function copyNodeJson(){
  const ta = document.getElementById('nodeJsonOutput');
  ta.select();
  document.execCommand('copy');
  alert('JSON 복사 완료 → locations.json에 붙여넣으세요');
}

function closeNodeJson(){
  document.getElementById('nodeJsonPanel').style.display = 'none';
}

</script>
